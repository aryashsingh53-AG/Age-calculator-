<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Age Calculator</title>
<style>
  :root{
    --bg:#f3efe6; --card:#fffdf8; --ink:#1d2433; --muted:#6a7080; --line:#d9d3c4;
    --accent:#1f4fd8; --accent-ink:#fff; --error:#b3261e;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#14171f; --card:#1c202b; --ink:#eceef4; --muted:#9aa1b3; --line:#2e3444;
      --accent:#7da2ff; --accent-ink:#0d1220; --error:#ff8a80; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
    background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
  main{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:28px 24px}
  h1{font-size:1.6rem;margin:0 0 4px}
  p.sub{margin:0 0 22px;color:var(--muted)}
  .row{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:10px}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
  input{width:100%;padding:11px 12px;font:inherit;font-size:1.05rem;color:var(--ink);
    background:transparent;border:1px solid var(--line);border-radius:8px}
  input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .actions{display:flex;gap:10px;margin-top:16px}
  button{font:inherit;font-weight:bold;padding:11px 18px;border-radius:8px;cursor:pointer;border:1px solid var(--line);
    background:transparent;color:var(--ink)}
  button.primary{flex:1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  #error{min-height:1.4em;margin:12px 0 0;color:var(--error);font-size:.95rem}
  #result{margin-top:10px;display:none}
  .age{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .age div{padding:16px 6px;text-align:center}
  .age div+div{border-left:1px solid var(--line)}
  .age b{display:block;font-size:2.4rem;line-height:1.1}
  .age span{color:var(--muted);font-size:.9rem}
  .facts{margin:14px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.95rem}
  .facts li{padding:3px 0}
  .facts strong{color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>Age Calculator</h1>
  <p class="sub">Enter your date of birth to see your exact age.</p>

  <div class="row">
    <div><label for="day">Day</label><input id="day" type="number" inputmode="numeric" min="1" max="31" placeholder="DD"></div>
    <div><label for="month">Month</label><input id="month" type="number" inputmode="numeric" min="1" max="12" placeholder="MM"></div>
    <div><label for="year">Year</label><input id="year" type="number" inputmode="numeric" placeholder="YYYY"></div>
  </div>

  <div class="actions">
    <button class="primary" id="calc">Calculate age</button>
    <button id="clear" type="button">Clear</button>
  </div>
  <p id="error" role="alert"></p>

  <section id="result" aria-live="polite">
    <div class="age">
      <div><b id="y">0</b><span>years</span></div>
      <div><b id="m">0</b><span>months</span></div>
      <div><b id="d">0</b><span>days</span></div>
    </div>
    <ul class="facts">
      <li>Total days lived: <strong id="total"></strong></li>
      <li>Next birthday: <strong id="next"></strong></li>
    </ul>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const daysInMonth = (y, m) => new Date(y, m, 0).getDate(); // m is 1-12; handles leap years
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;

function showError(msg){ $('error').textContent = msg; $('result').style.display = 'none'; }

function calculate(){
  $('error').textContent = '';
  const d = parseInt($('day').value, 10);
  const m = parseInt($('month').value, 10);
  const y = parseInt($('year').value, 10);

  if ([d, m, y].some(Number.isNaN)) return showError('Enter the day, month, and year.');
  if (y < 1900) return showError('Enter a year from 1900 onward.');
  if (m < 1 || m > 12) return showError('Month must be between 1 and 12.');
  if (d < 1 || d > daysInMonth(y, m)) {
    return showError(`That date doesn't exist. ${monthName(m)} ${y} has ${daysInMonth(y, m)} days.`);
  }

  const now = new Date();
  const ty = now.getFullYear(), tm = now.getMonth() + 1, td = now.getDate();
  const birth = new Date(y, m - 1, d);
  const today = new Date(ty, tm - 1, td);
  if (birth > today) return showError("That date is in the future. Enter a past date of birth.");

  // Years / months / days with borrowing
  let years = ty - y, months = tm - m, days = td - d;
  if (days < 0) {
    months--;
    const prevMonth = tm === 1 ? 12 : tm - 1;
    const prevYear = tm === 1 ? ty - 1 : ty;
    days += daysInMonth(prevYear, prevMonth);
  }
  if (months < 0) { years--; months += 12; }

  // Total days (UTC avoids daylight-saving errors)
  const MS = 86400000;
  const total = Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(y, m - 1, d)) / MS);

  // Next birthday (Feb 29 birthdays fall on Feb 28 in non-leap years)
  let ny = ty;
  const bdayIn = yr => (m === 2 && d === 29 && !isLeap(yr)) ? new Date(yr, 1, 28) : new Date(yr, m - 1, d);
  let next = bdayIn(ny);
  if (next < today) { ny++; next = bdayIn(ny); }
  const until = Math.round((Date.UTC(next.getFullYear(), next.getMonth(), next.getDate()) - Date.UTC(ty, tm - 1, td)) / MS);

  $('y').textContent = years;
  $('m').textContent = months;
  $('d').textContent = days;
  $('total').textContent = total.toLocaleString();
  $('next').textContent = until === 0
    ? 'Today. Happy birthday!'
    : `${next.toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long', year:'numeric'})} (in ${until} day${until === 1 ? '' : 's'})`;
  $('result').style.display = 'block';
}

function monthName(m){ return new Date(2000, m - 1, 1).toLocaleString('en', {month:'long'}); }

$('calc').addEventListener('click', calculate);
$('clear').addEventListener('click', () => {
  ['day','month','year'].forEach(id => $(id).value = '');
  $('error').textContent = ''; $('result').style.display = 'none'; $('day').focus();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>
</body>
</html>
